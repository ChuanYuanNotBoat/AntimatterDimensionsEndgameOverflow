name: i18n and overflow regressions

on:
  pull_request:
  push:
    branches:
      - feat/i18n-foundation
      - feat/i18n-adechinese-sync
      - fix/ade2-progression-hardening

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm run i18n:check
      - run: npm run test:i18n
      - run: npm run test:chapter3
      - run: node node_modules/@vue/cli-service/bin/vue-cli-service.js build --mode master
